name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race each other onto the live site
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the files the site actually needs are published — the README,
      # workflow and any local tooling stay out of the public artifact.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js assets _site/
          touch _site/.nojekyll
          # A custom domain has to travel with the artifact. Without CNAME in
          # here, a deploy can clear the domain set in the repo's settings.
          [ -f CNAME ] && cp CNAME _site/ || true

      # Stamp every asset with this commit's hash so each deploy busts the
      # browser cache. The ES module imports inside js/ are stamped too:
      # otherwise a returning visitor could get a fresh app.js running
      # against a stale, cached discs.js. Every importer gets the same URL,
      # so each module still loads exactly once.
      - name: Cache-bust assets
        run: |
          V=${GITHUB_SHA::7}
          sed -i -E "s/\?v=[0-9a-zA-Z]+/?v=$V/g" _site/index.html
          # the quote style matches whatever the formatter last used, so
          # accept either and keep the closing quote that was there
          sed -i -E "s#(from [\"']\./[a-z0-9-]+\.js)(\?v=[0-9a-zA-Z]+)?([\"'])#\1?v=$V\3#g" _site/js/*.js

      # This has failed silently once already — a formatter changed the
      # quotes and the stamp quietly stopped landing, which is precisely
      # the stale-module bug it exists to prevent. Now it is checked.
      - name: Check every asset carries this commit's stamp
        run: |
          V=${GITHUB_SHA::7}
          if grep -rno '?v=[0-9a-zA-Z]\+' _site/index.html _site/js | grep -v "?v=$V"; then
            echo "::error::the lines above were not stamped with $V"
            exit 1
          fi
          echo "all ?v= stamps are $V"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
