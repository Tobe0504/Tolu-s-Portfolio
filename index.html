<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tolulope Elijah — Work</title>
<meta name="description" content="The design work of Tolulope Elijah, product designer in Lagos. Browse the library disc by disc.">
<meta name="theme-color" content="#f2f2f2">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/site.css?v=6">

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body data-view="home">

<div class="grain" aria-hidden="true"></div>

<!-- the 3D library. Everything below is DOM layered over it. -->
<canvas id="stage" class="stage" aria-hidden="true"></canvas>

<!-- the hand-drawn marker loop that circles the disc you're pointing at -->
<svg class="loop" id="loop" aria-hidden="true"><path id="loop-path" pathLength="1"/></svg>

<!-- ══════════════ HOME ══════════════ -->
<main class="home" id="home">
  <h1 class="sr-only">Discover the work of Tolulope Elijah</h1>

  <section class="info" aria-hidden="true">
    <h2 class="info-title heading-s"><span class="swap" id="info-title"></span></h2>
    <div class="row"><p class="eyebrow">Role</p><p class="paragraph-m right"><span class="swap" id="info-role"></span></p></div>
    <div class="row"><p class="eyebrow">Year</p><p class="paragraph-m right"><span class="swap" id="info-year"></span></p></div>
    <div class="row"><p class="eyebrow">Team</p><p class="paragraph-m right"><span class="swap" id="info-team"></span></p></div>
  </section>

  <section class="reviews" id="reviews" aria-hidden="true"></section>

  <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  <p class="sr-only">Use the left and right arrow keys to browse projects. Press Enter to open the project in front, or Space to flip the disc over.</p>
  <ul class="sr-only" id="sr-list" aria-label="All projects"></ul>
</main>

<!-- ══════════════ PROJECT ══════════════ -->
<main class="project" id="project" hidden></main>

<!-- ══════════════ BAR ══════════════ -->
<nav class="bar" id="bar" aria-label="Site">
  <div class="index-panel" id="index-panel" role="dialog" aria-label="Project index" hidden>
    <ul class="index-list" id="index-list"></ul>
  </div>
  <div class="bar-row">
    <a class="wordmark" href="#/" aria-label="Tolulope Elijah, home">T<span>/</span>E</a>
    <div class="tabs" role="tablist" id="tabs"></div>
    <button class="index-btn" id="index-btn" aria-expanded="false" aria-controls="index-panel">
      <span id="index-label">Index</span>
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</nav>
<div class="scrim" id="scrim" hidden></div>

<noscript><p class="noscript">This site needs JavaScript and WebGL to show its disc library.</p></noscript>

<script type="module" src="js/app.js?v=8"></script>
</body>
</html>
